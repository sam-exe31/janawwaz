version: '3.8'

services:
  db:
    image: mysql:9.3
    container_name: janawwaz_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: janawwaz_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: janawwaz_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: mysql
      DB_NAME: janawwaz_db
      JWT_SECRET: super_secure_production_secret_key_minimum_32_characters_long_12345
      JWT_REFRESH_SECRET: another_super_secure_production_secret_key_minimum_32_chars
      COOKIE_SECRET: production_cookie_secret_minimum_32_chars_123456
      GEMINI_MOCK: "false"
      ENABLE_WHITELIST: "false"

volumes:
  mysql_data:
